<!doctype html><html lang="en"><head><title>Held-out accessibility toggles</title></head><body>
<script>function flip(el){ const k=el.hasAttribute('aria-expanded')?'aria-expanded':'aria-checked'; el.setAttribute(k, String(el.getAttribute(k).toLowerCase()!=='true')); }</script>
<button id="case-00" role="button" tabindex="0" aria-label="Orion option" aria-expanded="FALSE" onclick="flip(this)">Orion option</button>
<div id="case-01" role="checkbox" tabindex="0" aria-label="Cedar option" aria-checked="true" onclick="flip(this)">Cedar option</div>
<div id="case-02" role="switch" tabindex="0" aria-label="Comet option" aria-checked="false" onclick="flip(this)">Comet option</div>
<div id="case-03" role="menuitemcheckbox" tabindex="0" aria-label="Harbor option" aria-checked="true" onclick="flip(this)">Harbor option</div>
<button id="case-04" role="button" tabindex="0" aria-label="Quartz option" aria-expanded="TRUE" onclick="flip(this)">Quartz option</button>
<div id="case-05" role="checkbox" tabindex="0" aria-label="Willow option" aria-checked="false" onclick="flip(this)">Willow option</div>
<div id="case-06" role="switch" tabindex="0" aria-label="Falcon option" aria-checked="true" onclick="flip(this)">Falcon option</div>
<div id="case-07" role="menuitemcheckbox" tabindex="0" aria-label="Meadow option" aria-checked="false" onclick="flip(this)">Meadow option</div>
<button id="case-08" role="button" tabindex="0" aria-label="Ember option" aria-expanded="TRUE" onclick="flip(this)">Ember option</button>
<div id="case-09" role="checkbox" tabindex="0" aria-label="Delta option" aria-checked="false" onclick="flip(this)">Delta option</div>
<div id="case-10" role="switch" tabindex="0" aria-label="Cobalt option" aria-checked="true" onclick="flip(this)">Cobalt option</div>
<div id="case-11" role="menuitemcheckbox" tabindex="0" aria-label="Nimbus option" aria-checked="false" onclick="flip(this)">Nimbus option</div>
<div aria-label="Decorative Orion" role="generic" aria-expanded="true"></div>
</body></html>
